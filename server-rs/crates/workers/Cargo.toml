[package]
name    = "arcadia-workers"
edition.workspace = true
version.workspace = true

[features]
grpc = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto"]

[dependencies]
arcadia-core    = { workspace = true }
arcadia-db      = { workspace = true }
arcadia-decode  = { workspace = true }
arcadia-scoring = { workspace = true }
arcadia-chain   = { workspace = true }
arcadia-executor = { workspace = true }
arcadia-prices  = { workspace = true }

tokio        = { workspace = true }
sqlx         = { workspace = true }
redis        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
chrono       = { workspace = true }
tracing      = { workspace = true }
anyhow       = { workspace = true }
rust_decimal = { workspace = true }
borsh        = { workspace = true }
base64       = { workspace = true }
bs58         = { workspace = true }
reqwest      = { workspace = true }
futures-util = { workspace = true }

ed25519-dalek = { workspace = true }
curve25519-dalek = "4"
sha2          = { workspace = true }

# ── Yellowstone gRPC ingest (--features grpc) ────────────────────────────────
yellowstone-grpc-client = { version = "13.1.1", optional = true }
yellowstone-grpc-proto  = { version = "12.5.0", optional = true }
